# Supabase 무료 요금제는 일주일간 사용이 없으면 멈춘다.
# 사흘마다 데이터베이스에 가볍게 접속해서 멈추지 않게 한다.
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 3 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sf "https://jwdqfoavqibxvrccquna.supabase.co/rest/v1/departments?select=id&limit=1" \
            -H "apikey: sb_publishable_QbAicaAC7nefb8vbE1BNCA_pcJjvY6Z" -o /dev/null -w "%{http_code}\n"
