# preview 브랜치에 올리면 main 의 배포를 다시 돌려 /preview/ 주소를 새로 만든다
name: Preview

on:
  push:
    branches: [preview]
  delete:

permissions:
  actions: write
  contents: read

jobs:
  kick:
    runs-on: ubuntu-latest
    steps:
      - run: gh workflow run deploy.yml --ref main -R "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
