<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<script>
  // 휴대폰 위 상태 표시줄·아래 버튼 줄 피하기.
  // 보통은 브라우저가 알려 주는 안전 여백(env(safe-area-inset-*))을 쓴다 (아이폰, 크롬).
  // 삼성 인터넷 등 일부 안드로이드 홈 화면 앱은 화면을 끝까지 그리면서 여백을 0으로 알려 준다.
  // 그럴 때(앱 화면 비율 = 휴대폰 전체 비율)는 위 32px, 아래 48px를 직접 비운다. (--js-sat / --js-sab)
  (function () {
    if (!/Android/i.test(navigator.userAgent)) return
    var root = document.documentElement
    function fit() {
      var app = ['standalone', 'fullscreen', 'minimal-ui'].some(function (m) { return matchMedia('(display-mode: ' + m + ')').matches })
      var probe = document.createElement('div')
      probe.style.cssText = 'position:fixed;top:0;left:0;visibility:hidden;padding-top:env(safe-area-inset-top)'
      root.appendChild(probe)
      var envTop = parseFloat(getComputedStyle(probe).paddingTop) || 0
      root.removeChild(probe)
      var portrait = innerHeight >= innerWidth
      // 삼성 인터넷은 화면 크기(screen)와 앱 크기(inner)를 서로 다른 배율로 알려 준다 (예: screen 384x832, inner 360x800).
      // 그래서 크기 대신 세로/가로 비율로 본다: 앱 비율이 휴대폰 화면 비율만큼 길면 위아래 줄 밑까지 그리고 있는 것.
      var sL = Math.max(screen.width, screen.height), sS = Math.min(screen.width, screen.height)
      var iL = Math.max(innerWidth, innerHeight), iS = Math.min(innerWidth, innerHeight)
      var full = app && envTop === 0 && iL / iS >= sL / sS - 0.03
      root.style.setProperty('--js-sat', full ? '32px' : '0px')
      root.style.setProperty('--js-sab', full && portrait ? '48px' : '0px')
    }
    fit()
    addEventListener('resize', fit)
  })()
</script>
<title>대림교회 사역 데스크</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="theme-color" content="#151716">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="사역 데스크">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
</head>
<body>
<div id="root"></div>
<script>
  // 새 버전 배포 직후 예전 페이지가 남아 화면이 비면, 한 번만 새로 불러온다
  setTimeout(function () {
    var root = document.getElementById('root')
    if (root && !root.firstChild && !sessionStorage.getItem('dd-reloaded')) {
      sessionStorage.setItem('dd-reloaded', '1')
      location.replace(location.pathname + '?v=' + Date.now() + location.hash)
    }
  }, 4000)
  window.addEventListener('load', function () { setTimeout(function () { if (document.getElementById('root').firstChild) sessionStorage.removeItem('dd-reloaded') }, 5000) })
</script>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
