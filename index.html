<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>대림교회 사역 데스크</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="theme-color" content="#151716">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="사역 데스크">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
</head>
<body>
<div id="root"></div>
<script>
  // 새 버전 배포 직후 예전 페이지가 남아 화면이 비면, 한 번만 새로 불러온다
  setTimeout(function () {
    var root = document.getElementById('root')
    if (root && !root.firstChild && !sessionStorage.getItem('dd-reloaded')) {
      sessionStorage.setItem('dd-reloaded', '1')
      location.replace(location.pathname + '?v=' + Date.now() + location.hash)
    }
  }, 4000)
  window.addEventListener('load', function () { setTimeout(function () { if (document.getElementById('root').firstChild) sessionStorage.removeItem('dd-reloaded') }, 5000) })
</script>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
